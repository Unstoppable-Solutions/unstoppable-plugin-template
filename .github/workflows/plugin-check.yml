name: Plugin Check

# Does nothing on the template repo itself (placeholder tokens would fail to parse).
# Runs normally the moment someone clones the template as their own repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    name: Run WordPress Plugin Check
    runs-on: ubuntu-latest
    if: ${{ ! github.event.repository.is_template }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './'
          exclude-checks: |
            late_escaping
          exclude-files: |
            .gitattributes
            .gitignore
            .distignore
            .github
            README.md
            CLAUDE.md
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
          include-experimental: true

